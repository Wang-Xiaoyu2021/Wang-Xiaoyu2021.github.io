# ============================================================
# ADIWANG Team — AI-assisted Design & Innovation (Jilin University)
# Jekyll 站点配置 (GitHub Pages 原生兼容)
# ============================================================

title: "ADIWANG Team · AI-assisted Design & Innovation"
email: wang.xiaoyu@example.edu.cn
description: >-
  ADIWANG Team（人工智能辅助设计与创新小组），吉林大学张立军团队下属研究小组，
  聚焦第一性原理计算、光电半导体材料设计与材料信息学。
  ADIWANG Team is a research subgroup affiliated with Prof. Lijun Zhang's group
  at Jilin University, focusing on first-principles calculations, optoelectronic
  semiconductor materials and materials informatics.
baseurl: ""          # 部署到 username.github.io 根路径留空；若是子仓库填 /repo-name
url: "https://wang-xiaoyu2021.github.io"
github_username: wang-xiaoyu2021
scholar_url: "https://scholar.google.com.hk/citations?user=c3w343cAAAAJ&hl=zh-CN"

# ---------- 语言设置 ----------
# 默认语言 zh（中文），English 页面放在 /en/ 路径下
default_lang: zh
languages: [zh, en]

# ---------- 构建配置 ----------
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

permalink: pretty

# GitHub Pages 支持的插件
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# ---------- 默认 Front Matter ----------
defaults:
  - scope:
      path: ""
    values:
      lang: zh
  - scope:
      path: "en"
    values:
      lang: en
  - scope:
      path: "pages/en"
    values:
      lang: en

# ---------- 排除文件 ----------
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
  - node_modules
  - vendor
  - .sass-cache

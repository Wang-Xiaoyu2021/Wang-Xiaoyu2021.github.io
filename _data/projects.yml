- key: project-2
  title_zh: SolarDesign 光伏器件仿真与设计平台
  title_en: SolarDesign Photovoltaic Device Simulation Platform
  desc_zh: 开发在线光伏器件仿真与设计平台，实现太阳能电池器件性能的快速模拟、优化与方案设计。
  desc_en: An online photovoltaic device simulation and design platform for rapid simulation, optimization and design of solar cell device performance.
  tags: [光伏器件, 仿真平台, 设计工具]
  tags_en: [Photovoltaics, Simulation, Design Tools]
  icon: battery
  status_zh: 持续推进
  status_en: Ongoing
  papers: [p2025-2, p2026-1]

- key: project-3
  title_zh: 钙钛矿太阳能电池界面与缺陷工程
  title_en: Interface & Defect Engineering of Perovskite Solar Cells
  desc_zh: 从原子尺度研究自组装分子对界面缺陷钝化与偶极调控的作用机制，为高效稳定钙钛矿太阳能电池提供理论设计。
  desc_en: Understanding at the atomic scale how self-assembled molecules passivate interfacial defects and modulate dipoles, providing theoretical design for efficient and stable perovskite solar cells.
  tags: [钙钛矿, 缺陷钝化, 界面工程]
  tags_en: [Perovskite, Defect Passivation, Interface Engineering]
  icon: crystal
  status_zh: 进行中
  status_en: Ongoing
  papers: [p2023-6, p2023-4, p2025-3]

- key: project-4
  title_zh: 全钙钛矿叠层太阳能电池计算设计
  title_en: Computational Design of All-Perovskite Tandem Solar Cells
  desc_zh: 面向高性能叠层光伏，开展宽带隙/窄带隙钙钛矿材料与接触界面的计算设计，助力叠层器件效率突破。
  desc_en: Computational design of wide/narrow-bandgap perovskites and contact interfaces for high-performance tandem photovoltaics, pushing tandem device efficiency beyond limits.
  tags: [叠层电池, 计算设计, 光伏]
  tags_en: [Tandem Cells, Computational Design, Photovoltaics]
  icon: flask
  status_zh: 进行中
  status_en: Ongoing
  papers: [p2024-6, p2023-5, p2022-3]

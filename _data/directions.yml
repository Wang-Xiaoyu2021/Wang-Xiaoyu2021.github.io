# 主要研究方向
- key: first-principles
  icon: cpu
  title_zh: 第一性原理计算与材料模拟
  title_en: First-principles Calculations & Materials Simulation
  desc_zh: 基于密度泛函理论开展电子结构、相变与热/电输运性质的高精度模拟，从原子尺度理解并预测材料的本征性能。
  desc_en: High-precision simulations of electronic structure, phase transitions and thermal/electrical transport based on density functional theory, understanding and predicting intrinsic properties at the atomic scale.

- key: optoelectronic
  icon: crystal
  title_zh: 光电半导体材料设计
  title_en: Design of Optoelectronic Semiconductor Materials
  desc_zh: 面向钙钛矿及新型半导体光电材料，结合第一性原理与机器学习，设计高性能发光、探测与载流子传输材料。
  desc_en: Combining first-principles methods with machine learning to design high-performance light-emitting, detecting and charge-transport materials based on perovskites and emerging semiconductors.

- key: photovoltaics
  icon: battery
  title_zh: 钙钛矿光伏与器件模拟
  title_en: Perovskite Photovoltaics & Device Simulation
  desc_zh: 研究钙钛矿太阳能电池中的缺陷钝化、界面工程与载流子动力学，并开发器件仿真与设计工具。
  desc_en: Investigating defect passivation, interface engineering and carrier dynamics in perovskite solar cells, and developing device simulation and design tools.

- key: materials-informatics
  icon: brain
  title_zh: 材料信息学与人工智能
  title_en: Materials Informatics & Artificial Intelligence
  desc_zh: 建设高通量计算与数据库驱动的材料信息学基础设施，利用机器学习和人工智能加速材料筛选与发现。
  desc_en: Building high-throughput computation and database-driven materials informatics infrastructure, accelerating materials screening and discovery with machine learning and AI.

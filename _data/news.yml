- date: 2026-07-30
  tag_zh: 论文
  tag_en: Paper
  title_zh: "Nature Photonics | 二维钙钛矿 p-n 类型转变实现高效稳定钙钛矿/晶硅叠层太阳能电池"
  title_en: "Nature Photonics | Modulating p-n transition of 2D perovskites for efficient and stable perovskite/Si tandem photovoltaics"
  content_zh: >
    团队与上海交通大学溥渊未来技术学院未来光伏中心（赵一新教授）等合作，在 Nature Photonics
    发表题为 "Modulating p-n transition of two-dimensional perovskites for efficient and stable
    perovskite/Si tandem photovoltaics" 的研究论文。研究提出分子偶极矩调控策略，实现二维钙钛矿
    由本征 p 型向 n 型导电转变，构筑与宽带隙三维钙钛矿匹配的高效二维/三维异质结界面。
    基于该策略，1.68 eV 宽带隙 p-i-n 钙钛矿电池效率由 20.19% 提升至 23.40%，钙钛矿/晶硅叠层
    电池实现 33.64% 的认证光电转换效率，并在最大功率点连续运行 1100 小时后仍保持 92% 的初始效率。
    吉林大学王啸宇为论文共同作者之一。
  content_en: >
    In collaboration with the Future Photovoltaics Research Center of Zhiyuan Future Technology
    College at Shanghai Jiao Tong University (Prof. Yixin Zhao) and other partners, the team
    published "Modulating p-n transition of two-dimensional perovskites for efficient and stable
    perovskite/Si tandem photovoltaics" in Nature Photonics. A molecular dipole engineering strategy
    converts 2D perovskites from intrinsically p-type to n-type, building high-quality 2D/3D
    heterojunctions matched with wide-bandgap 3D perovskites. The 1.68 eV p-i-n perovskite cell
    efficiency increased from 20.19% to 23.40%, and the perovskite/Si tandem achieved a certified
    efficiency of 33.64%, retaining 92% of its initial efficiency after 1100 hours of
    maximum-power-point tracking. Xiaoyu Wang (Jilin University) is a co-author of the paper.
  url: https://gift.sjtu.edu.cn/news/1159

- date: 2026-07-01
  tag_zh: 论文
  tag_en: Paper
  title_zh: "Science Bulletin | 数据驱动轻元素替换实现拓扑材料向半导体的理论预测（封面故事）"
  title_en: "Science Bulletin | Data-driven light-element substitution predicts semiconductors from topological materials (Cover Story)"
  content_zh: >
    课题组在 Science Bulletin 发表题为 "Theoretical prediction of semiconductors by data driven
    light-element substitution in topological materials" 的研究论文（71 卷 3631-3641 页），
    并被选为当期封面故事。研究基于数据驱动的轻元素替换策略，在拓扑材料体系中系统预测了具有
    可调带隙、高载流子迁移率与良好稳定性的新型半导体，为高性能半导体材料的理性设计提供了新路径。
    吉林大学博士研究生周岩松为论文第一作者，王啸宇等为共同作者。
  content_en: >
    The group published "Theoretical prediction of semiconductors by data driven light-element
    substitution in topological materials" in Science Bulletin (71, 3631-3641), selected as the
    cover story of the issue. Using a data-driven light-element substitution strategy, the study
    systematically predicts novel semiconductors with tunable band gaps, high carrier mobility and
    good stability from topological materials, offering a new route for the rational design of
    high-performance semiconductors. Yansong Zhou, a PhD student at Jilin University, is the first
    author; Xiaoyu Wang and others are co-authors.
  url: https://www.sciencedirect.com/journal/science-bulletin/about/cover-stories/novel-semiconductors-spawned-by-topological-materials

- date: 2025-04-24
  tag_zh: 论文
  tag_en: Paper
  title_zh: "National Science Review | 自组装分子在卤化物钙钛矿光电器件中的原子尺度作用机制综述"
  title_en: "National Science Review | Review on the atomic-scale role of self-assembled molecules in halide perovskite optoelectronics"
  content_zh: >
    王啸宇等在 National Science Review 发表综述 "Role of self-assembled molecules in halide
    perovskite optoelectronics: an atomic-scale perspective"（12 卷 5 期, nwaf150），从原子尺度
    系统阐述了自组装分子在卤化物钙钛矿光电器件中的缺陷钝化、偶极调控与载流子输运作用机制，
    为高效稳定钙钛矿器件的分子设计提供了系统性的理论框架。
  content_en: >
    Xiaoyu Wang et al. published a review entitled "Role of self-assembled molecules in halide
    perovskite optoelectronics: an atomic-scale perspective" in National Science Review (12(5),
    nwaf150), systematically addressing the atomic-scale roles of self-assembled molecules in
    defect passivation, dipole modulation and carrier transport of halide perovskite optoelectronics,
    providing a comprehensive framework for molecular design of efficient and stable perovskite
    devices.
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12096312/

- date: 2024-10-16
  tag_zh: 论文
  tag_en: Paper
  title_zh: "Nature | 张立军教授团队与合作者在钙钛矿太阳能电池电子传输层界面优化设计方向取得新进展"
  title_en: "Nature | New progress in interface engineering of all-perovskite tandem solar cells"
  content_zh: >
    吉林大学材料科学与工程学院张立军教授团队与南京大学谭海仁教授、剑桥大学 Samuel D. Stranks 教授团队合作，
    创新性地在钙钛矿叠层太阳能电池顶部电子传输层界面引入定制的二维钙钛矿插层（TTDL），
    并结合原子尺度第一性原理模拟揭示了其提升界面均匀性、优化电子传输的机理。
    基于优化后的电子传输层，1.05 cm² 全钙钛矿叠层电池实现了 28.2% 的认证光电转换效率，
    为当时该尺寸下的世界纪录，并被收录于国际权威的《Solar cell efficiency tables》。
    吉林大学博士生王啸宇为论文共同第一作者之一，承担理论计算工作。
    研究成果以 "Homogenized contact in all-perovskite tandems using tailored 2D perovskite" 为题发表于 Nature。
  content_en: >
    The team of Prof. Lijun Zhang (Jilin University), together with Prof. Hairen Tan (Nanjing
    University) and Prof. Samuel D. Stranks (University of Cambridge), introduced tailored 2D
    perovskite interlayers (TTDL) at the top electron-transport interface of all-perovskite
    tandem solar cells, and revealed the mechanism of interface homogenization via atomic-scale
    first-principles simulations. A 1.05 cm² all-perovskite tandem achieved a certified efficiency
    of 28.2%, a world record at that size at the time, and was included in the authoritative
    Solar cell efficiency tables. Xiaoyu Wang, a PhD student at Jilin University, is a co-first
    author responsible for the theoretical calculations. The work was published in Nature as
    "Homogenized contact in all-perovskite tandems using tailored 2D perovskite".
  url: https://news.jlu.edu.cn/info/1306/58719.htm

- date: 2023-07-03
  tag_zh: 论文
  tag_en: Paper
  title_zh: "Nature Energy | 无甲铵/无溴甲脒钙钛矿太阳能电池缺陷抑制研究取得新突破"
  title_en: "Nature Energy | New breakthrough in defect suppression of formamidinium perovskite solar cells"
  content_zh: >
    继 Science 发表不到三个月，合作团队再次于 Nature Energy 发表题为
    "Reduction of bulk and surface defects in inverted methylammonium- and bromide-free
    formamidinium perovskite solar cells" 的研究论文。研究通过路易斯碱添加剂（DBSO）与
    表面钝化（2CF3-PEAI）策略，显著降低钙钛矿薄膜的体相与表面缺陷，反式钙钛矿太阳能电池
    实现了 25.1% 的功率转换效率，并在连续光照 1800 小时及湿热条件（85 °C / 85% RH）1000 小时后，
    分别保持初始效率的 97.4% 和 98.2%。
  content_en: >
    Within three months after the Science paper, the collaborative team published a follow-up
    study in Nature Energy entitled "Reduction of bulk and surface defects in inverted
    methylammonium- and bromide-free formamidinium perovskite solar cells". By combining a
    Lewis-base additive (DBSO) and surface passivation (2CF3-PEAI), the bulk and surface defects
    of perovskite films were significantly suppressed. The inverted perovskite solar cells reached
    25.1% efficiency and retained 97.4% and 98.2% of their initial efficiency after 1800 hours of
    continuous illumination and 1000 hours under damp-heat conditions (85 °C / 85% RH), respectively.
  url: https://www.wnlopsc.cn/archives/725

- date: 2023-04-27
  tag_zh: 论文
  tag_en: Paper
  title_zh: "Science | 反式钙钛矿太阳能电池埋底界面缺陷优化研究取得重要进展"
  title_en: "Science | Minimizing buried interfacial defects for efficient inverted perovskite solar cells"
  content_zh: >
    团队与华东理工大学吴永真教授、朱为宏教授，吉林大学张立军教授，波茨坦大学 Martin Stolterfoht 教授等合作，
    在 Science 发表题为 "Minimizing buried interfacial defects for efficient inverted perovskite solar cells"
    的研究论文。研究通过具有亲水性锚定基团与疏水性空穴提取基团的两亲性分子空穴传输剂，
    改善钙钛矿薄膜的润湿与钝化，最大限度地减少埋底界面缺陷。封装的 1 cm² 太阳能电池实现了
    23.4% 的功率转换效率，并展现出优异的运行稳定性与湿热稳定性。吉林大学博士生王啸宇为论文共同第一作者之一。
  content_en: >
    In collaboration with Prof. Yongzhen Wu and Prof. Weihong Zhu (East China University of
    Science and Technology), Prof. Lijun Zhang (Jilin University) and Prof. Martin Stolterfoht
    (University of Potsdam), the team published "Minimizing buried interfacial defects for
    efficient inverted perovskite solar cells" in Science. An amphiphilic molecule hole-transporter
    with hydrophilic anchoring and hydrophobic hole-extracting groups improves wetting and
    passivation, minimizing buried interfacial defects. Encapsulated 1 cm² cells reached 23.4%
    efficiency with excellent operational and damp-heat stability. Xiaoyu Wang, a PhD student at
    Jilin University, is a co-first author.
  url: https://www.wnlopsc.cn/archives/725


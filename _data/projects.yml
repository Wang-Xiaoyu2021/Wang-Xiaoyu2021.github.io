- key: project-1
  title_zh: JAMIP 材料信息学基础设施
  title_en: JAMIP Materials Informatics Infrastructure
  desc_zh: 建设面向计算材料信息学的人工智能辅助数据驱动平台，支持高通量计算、数据管理与材料筛选，为数据驱动材料研究提供基础设施。
  desc_en: An AI-aided, data-driven infrastructure for computational materials informatics, supporting high-throughput computation, data management and materials screening for data-driven research.
